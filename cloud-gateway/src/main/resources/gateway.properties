spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=1800


##gateway secure-headers config
##gateway \u5b89\u5168\u6807\u5934\u8fc7\u6ee4\u5668\u662f\u5426\u542f\u7528
spring.cloud.gateway.filter.secure-headers.enabled=false
##gateway \u5b89\u5168\u6807\u5934\u8fc7\u6ee4\u5185\u5bb9\u5b89\u5168\u7b56\u7565
spring.cloud.gateway.filter.secure-headers.content-security-policy=default-src 'self'; style-src 'self' 'unsafe-inline' data: ; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data: ; img-src * data: http: ; connect-src 'self' data: ; frame-src 'unsafe-inline' http: ; frame-ancestors 'self' http://*
##gateway \u5b89\u5168\u6807\u5934\u8fc7\u6ee4XSS\u4fdd\u62a4\u8bf7\u6c42\u5934
spring.cloud.gateway.filter.secure-headers.xss-protection-header=1;mode=block
##gateway \u5b89\u5168\u6807\u5934\u7981\u7528\u7684\u8bf7\u6c42\u5934
spring.cloud.gateway.filter.secure-headers.disable=x-xss-protection,strict-transport-security,x-frame-options,x-content-type-options,referrer-policy,content-security-policy,x-download-options,x-permitted-cross-domain-policies
#gateway filters config
##gateway\u9ed8\u8ba4\u8fc7\u6ee4\u5668\uff1a\u6d88\u9664\u91cd\u590d\u7684\u54cd\u5e94\u5934
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Content-Security-Policy X-XSS-Protection
spring.cloud.gateway.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
##gateway\u9ed8\u8ba4\u8fc7\u6ee4\u5668\uff1a\u8bbe\u7f6e\u54cd\u5e94\u5934
spring.cloud.gateway.default-filters[2]=SetResponseHeader=X-Frame-Options, SAMEORIGIN
spring.cloud.gateway.default-filters[3]=SetResponseHeader=Allow,GET|POST|OPTIONS

