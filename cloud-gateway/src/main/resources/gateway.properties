##gateway httpclient config
##\u4e3aNetty HttpClient\u542f\u7528\u538b\u7f29\u3002
spring.cloud.gateway.httpclient.compression=true
##\u8fde\u63a5\u8d85\u65f6\uff0c\u5355\u4f4d\u4e3amillis\uff0c\u9ed8\u8ba4\u4e3a45s
spring.cloud.gateway.httpclient.connect-timeout=2000
##\u54cd\u5e94\u8d85\u65f6\uff0c\u5355\u4f4d\u4e3amillis
spring.cloud.gateway.httpclient.response-timeout=PT15S
##\u6700\u5927\u54cd\u5e94\u5934\u5927\u5c0f
spring.cloud.gateway.httpclient.max-header-size=32768
##\u4f9bHttpClient\u4f7f\u7528\u7684\u6c60\u7c7b\u578b\uff0c\u9ed8\u8ba4\u4e3aELASTIC
spring.cloud.gateway.httpclient.pool.type=FIXED
##\u6700\u5927\u8fde\u63a5\u6570
spring.cloud.gateway.httpclient.pool.max-connections=1000 
##\u6700\u5927\u8fde\u63a5\u65f6\u95f4
#spring.cloud.gateway.httpclient.pool.max-life-time=PT45S
##\u6700\u5927\u7a7a\u95f2\u65f6\u95f4\uff1a\u7a7a\u95f2\u8fde\u63a5\u8d85\u65f6\u56de\u6536\u65f6\u95f4
spring.cloud.gateway.httpclient.pool.max-idle-time=PT1S
##\u8fd4\u56de\u65f6\u95f4
spring.cloud.gateway.httpclient.pool.acquire-timeout=5000

##gateway cors config
##\u662f\u5426\u5141\u8bb8\u5168\u5c40CORS\u914d\u7f6e\u6dfb\u52a0\u5230URL\u5904\u7406\u7a0b\u5e8f
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
##cors\u662f\u5426\u5141\u8bb8\u51ed\u8bc1
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
