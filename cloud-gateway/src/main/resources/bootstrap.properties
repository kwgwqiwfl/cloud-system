# ===================== 应用基础配置 =====================
spring.application.name=cloud-gateway
spring.main.banner-mode=off
# 网关固定为响应式 web，不可修改
spring.main.web-application-type=reactive
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true

# 激活环境：开发环境 dev
spring.profiles.active=dev

# ===================== Nacos 配置中心 【统一】 =====================
spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.config.server-addr=localhost:8848
spring.cloud.nacos.config.namespace=dev
spring.cloud.nacos.config.group=RING_CLOUD_GROUP
spring.cloud.nacos.config.prefix=${spring.application.name}
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.username=nacos
spring.cloud.nacos.config.password=nacos

# ===================== Nacos 服务发现 【统一，和配置中心一致】 =====================
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=${spring.cloud.nacos.config.server-addr}
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}
spring.cloud.nacos.discovery.group=${spring.cloud.nacos.config.group}
spring.cloud.nacos.discovery.username=${spring.cloud.nacos.config.username}
spring.cloud.nacos.discovery.password=${spring.cloud.nacos.config.password}

# ===================== Gateway 服务发现自动路由（lb:// 协议依赖） =====================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ===================== 扩展配置加载（标准顺序） =====================
# 1. 公共全局配置
spring.cloud.nacos.config.extension-configs[0].data-id=common-${spring.profiles.active}.properties
spring.cloud.nacos.config.extension-configs[0].group=${spring.cloud.nacos.config.group}
spring.cloud.nacos.config.extension-configs[0].refresh=true

# 2. 网关动态路由 JSON（热刷新，和代码常量对齐）
spring.cloud.nacos.config.extension-configs[1].data-id=gateway-route.json
spring.cloud.nacos.config.extension-configs[1].group=${spring.cloud.nacos.config.group}
spring.cloud.nacos.config.extension-configs[1].refresh=true

# ===================== 动态路由自定义开关（业务自用） =====================
gateway.route.dynamic.enabled=true
gateway.route.fallback.enable=true

# ===================== 日志配置 =====================
logging.config=classpath:log4j2.xml

# JWT 配置（和 auth、user 服务保持完全一致）
jwt.secret=你的密钥
jwt.expire=3600000