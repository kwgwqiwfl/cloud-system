# 服务端口
server.port=8082

# JWT 配置
jwt.secret=your_secure_jwt_secret_key_2026
jwt.expire=3600000

# 数据库配置
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/your_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.mapper-locations=classpath:mybatis/**/*.xml
mybatis.type-aliases-package=com.ring.cloud.user.entity