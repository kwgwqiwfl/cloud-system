# ===================== 一、基础服务配置（响应式网关） =====================
server.port=8666
# Session Cookie 配置（响应式有效）
server.reactive.session.cookie.name=${spring.application.name}
server.reactive.session.cookie.same-site=none
server.reactive.session.cookie.secure=true
server.error.path=/error
server.max-http-header-size=10MB

# ===================== 二、Netty HttpClient 连接池（高并发标准） =====================
spring.cloud.gateway.httpclient.compression=true
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=PT15S
spring.cloud.gateway.httpclient.max-header-size=32768
spring.cloud.gateway.httpclient.pool.type=FIXED
spring.cloud.gateway.httpclient.pool.max-connections=1000
spring.cloud.gateway.httpclient.pool.max-life-time=PT45S
spring.cloud.gateway.httpclient.pool.max-idle-time=PT1S
spring.cloud.gateway.httpclient.pool.acquire-timeout=5000

# ===================== 三、全局跨域 CORS =====================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers[0]=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers[1]=X-AUTH-TOKEN
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=1800

# ===================== 四、网关安全 & 默认过滤器 =====================
spring.cloud.gateway.filter.secure-headers.enabled=false
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Content-Security-Policy X-XSS-Protection
spring.cloud.gateway.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
spring.cloud.gateway.default-filters[2]=SetResponseHeader=X-Frame-Options, SAMEORIGIN
spring.cloud.gateway.default-filters[3]=SetResponseHeader=Allow,GET|POST|PUT|DELETE|OPTIONS

# ===================== 五、静态路由（兜底，和 Nacos 动态路由并存） =====================
spring.cloud.gateway.routes[0].id=auth-server
spring.cloud.gateway.routes[0].uri=lb://auth-server
spring.cloud.gateway.routes[0].order=1
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=PreserveHostHeader
spring.cloud.gateway.routes[0].filters[1]=RemoveRequestHeader=Expect

spring.cloud.gateway.routes[1].id=system-center
spring.cloud.gateway.routes[1].uri=lb://system-center
spring.cloud.gateway.routes[1].order=1
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/sys/center/**
spring.cloud.gateway.routes[1].filters[0]=PreserveHostHeader
spring.cloud.gateway.routes[1].filters[1]=RemoveRequestHeader=Expect

# ===================== 六、JWT 鉴权 & 白名单 =====================
spring.security.token.converter.support-bearer-token-names=Authorization,X-AUTH-TOKEN,access_token
spring.security.token.converter.supportBearerTokenNames=Authorization,X-AUTH-TOKEN,access_token
spring.security.token.converter.allow-uri-query-parameter=false
spring.security.token.ignored.any-methods=/api/auth/**,/swagger-resources/**,/v2/api-docs,/swagger-ui/**,/actuator/**,/error/**
spring.security.token.ignored.static-resources=/webjars/**,/css/**,/js/**,/img/**,/fonts/**,/*.ico

# ===================== 七、Sentinel 流量防护（单独服务，所有网关都配同一个连接就可以） =====================
spring.cloud.sentinel.enabled=true
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.transport.dashboard=192.168.1.145:8080
spring.cloud.sentinel.transport.port=8721
# 修正：合法单位 ms，原 600s 格式报错
spring.cloud.sentinel.transport.heartbeat-interval-ms=600000

spring.cloud.alibaba.sentinel.gateway.enabled=true
# 统一引用 Nacos 地址，不硬编码
spring.cloud.sentinel.datasource.flow.nacos.server-addr=${spring.cloud.nacos.config.server-addr}
spring.cloud.sentinel.datasource.flow.nacos.group-id=RING_CLOUD_GROUP
spring.cloud.sentinel.datasource.flow.nacos.data-id=${spring.application.name}-gateway-flow
spring.cloud.sentinel.datasource.flow.nacos.file-type=json
spring.cloud.sentinel.datasource.flow.nacos.rule-type=gateway-flow

spring.cloud.sentinel.datasource.degrade.nacos.server-addr=${spring.cloud.nacos.config.server-addr}
spring.cloud.sentinel.datasource.degrade.nacos.group-id=RING_CLOUD_GROUP
spring.cloud.sentinel.datasource.degrade.nacos.data-id=${spring.application.name}-gateway-degrade
spring.cloud.sentinel.datasource.degrade.nacos.file-type=json
spring.cloud.sentinel.datasource.degrade.nacos.rule-type=degrade

# ===================== 八、监控 & 可观测 =====================
management.endpoint.httptrace.enabled=true
management.endpoint.httptrace.summarytime=5
management.endpoint.httptrace.timeout=5000
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===================== 九、Swagger 文档 =====================
swagger2.api-info.title=Baymax Platform
swagger2.api-info.version=1.4
swagger2.api-info.description=Baymax 前后端统一接口文档（Web/APP）