#spring config
spring.application.name=woven-gateway
spring.main.banner-mode=off
spring.main.web-application-type=reactive
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true
##active profiles
spring.profiles.active=dev
##nacos config configs
spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.config.username=nacos
spring.cloud.nacos.config.password=nacos
spring.cloud.nacos.config.server-addr=192.168.1.61:8848
spring.cloud.nacos.config.prefix=${spring.application.name}
#spring.cloud.nacos.config.prefix=woven-gateway-oauth2-local
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.namespace=baymax16x
spring.cloud.nacos.config.group=baymax
spring.cloud.nacos.config.extension-configs[0].group=${spring.cloud.nacos.config.group}
spring.cloud.nacos.config.extension-configs[0].data-id=common-${spring.profiles.active}.properties

#dataId prefix
spring.cloud.nacos.config.data-id-url-prefix=http://${spring.cloud.nacos.config.server-addr}/nacos/v1/cs/configs?tenant=${spring.cloud.nacos.config.namespace}&group=${spring.cloud.nacos.config.group}&username=${spring.cloud.nacos.config.username}&password=${spring.cloud.nacos.config.password}&dataId=

#logging config
logging.config=classpath:log4j2.xml