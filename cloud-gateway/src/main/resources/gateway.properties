##spring.cloud.gateway.globalcors.cors-configurations.[/**].resolved-methods[0]=*
#cors\u5141\u8bb8\u57df\u7684\u5339\u914d\u8868\u8fbe\u5f0f\uff0c\u4e0eallowed-origins\u4e8c\u9009\u4e00
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns[0]=*
##cors\u5141\u8bb8\u7684\u57df\u540d\u79f0\uff0c\u4e0eallowed-origin-patterns\u4e8c\u9009\u4e00
